version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - clauseguard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MONGODB_URI=mongodb://mongo:27017/clauseguard
      - APP_API_KEY=${APP_API_KEY}
      - PORT=3001
    depends_on:
      - mongo
    networks:
      - clauseguard-network

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - clauseguard-network

volumes:
  mongodb-data:

networks:
  clauseguard-network:
    driver: bridge